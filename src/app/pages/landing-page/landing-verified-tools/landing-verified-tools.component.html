@if (articles.length > 0) {
  <section class="verified" aria-labelledby="landing-verified-heading">
    <p class="eyebrow mono" i18n="@@page.landing.verifiedTools.eyebrow">HOW IT WORKS</p>
    <h2 id="landing-verified-heading" i18n="@@page.landing.verifiedTools.heading">ツールの裏側を記事にしています</h2>
    <p class="verified__intro" i18n="@@page.landing.verifiedTools.intro">
      動く仕組みや、つまずきやすいエッジケースがなぜ起きるのかを調べて記事にまとめました。各記事から、対応するツールへ移動できます。
    </p>

    <div class="verified__grid">
      @for (article of articles; track article.slug) {
        <article class="verified-card">
          <a class="verified-card__title" [routerLink]="article.routerLink">{{ article.title }}</a>
          <p class="verified-card__summary">{{ article.summary }}</p>
          <app-article-related-tools [routerLinks]="article.relatedTools"></app-article-related-tools>
        </article>
      }
    </div>
    <a class="verified__more" routerLink="/articles" i18n="@@page.landing.history.more">これまでの記事一覧を見る</a>
  </section>
}
